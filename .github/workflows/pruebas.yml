name: Pruebas

# El recorrido completo de la app, en cada cambio. Va aparte del despliegue a
# propósito: si un día falla la instalación del navegador, quiero enterarme,
# pero no quiero que eso impida que tu móvil reciba la versión nueva.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
